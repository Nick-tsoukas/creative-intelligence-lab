name: Elite UX skill package integrity

on:
  pull_request:
    paths:
      - 'skills/elite-ux-director/**'
      - 'scripts/check-elite-ux-director.py'
      - 'quality/ux_skill_eval_cases.json'
      - '.github/workflows/elite-ux-skill-check.yml'
  push:
    branches: [main]
    paths:
      - 'skills/elite-ux-director/**'
      - 'scripts/check-elite-ux-director.py'
      - 'quality/ux_skill_eval_cases.json'
      - '.github/workflows/elite-ux-skill-check.yml'

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify skill package only (not model outcomes)
        run: python scripts/check-elite-ux-director.py
