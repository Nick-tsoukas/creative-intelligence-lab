name: Contextual Project Design Packet integrity

on:
  pull_request:
    paths:
      - 'scripts/prepare_design_packet.py'
      - 'scripts/test_design_packet.py'
      - 'docs/PROJECT_DESIGN_PACKET_ROUTER.md'
      - '.github/workflows/contextual-design-packet.yml'
      - 'scripts/query_interface_atlas.py'
      - 'scripts/visual_workspace.py'
  push:
    branches: [main]
    paths:
      - 'scripts/prepare_design_packet.py'
      - 'scripts/test_design_packet.py'
      - 'scripts/query_interface_atlas.py'
      - 'scripts/visual_workspace.py'
      - '.github/workflows/contextual-design-packet.yml'

permissions:
  contents: read

jobs:
  bounded-source-context:
    name: Offline research packet, evidence and privacy checks
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit/integration tests for source packet, Atlas, and project workspace
        run: |
          python -m py_compile scripts/prepare_design_packet.py scripts/test_design_packet.py
          python -m unittest discover -s scripts -p test_design_packet.py -v
          python -m unittest discover -s scripts -p test_visual_workspace.py -v
          python -m unittest discover -s scripts -p test_interface_atlas.py -v
          python scripts/build_interface_gallery.py --check
          python scripts/prepare_design_packet.py --help > /dev/null
      - name: Prevent private screenshot and packet leakage
        run: |
          if git ls-files | grep -q '^\.cil-private/'; then
            echo "::error::Private project media tracked in Git"
            exit 1
          fi
          grep -qx '.cil-private/' .gitignore
          echo "PASS: all generated private images and research packets stay outside version control"
