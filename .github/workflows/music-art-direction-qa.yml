name: Music Art-Direction Sandbox QA

on:
  push:
    paths:
      - 'experiments/003-music-art-direction-comparison/**'
      - '.github/workflows/music-art-direction-qa.yml'
  pull_request:
    paths:
      - 'experiments/003-music-art-direction-comparison/**'
      - '.github/workflows/music-art-direction-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test harness
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run eight viewport x direction checks
        run: |
          cd experiments/003-music-art-direction-comparison
          python advanced_qa.py --html index.html --output advanced_results.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-direction-dom-qa
          path: experiments/003-music-art-direction-comparison/advanced_results.json
          if-no-files-found: warn
          retention-days: 14
