<text x="389" y="443" font-family="Arial,sans-serif" fill="#243244" font-size="16">Checking…</text>
<text x="75" y="508" font-family="Arial,sans-serif" fill="#6d7785" font-size="16">Labels • focus • pending • success • error</text>
<rect x="75" y="539" width="458" height="82" rx="12" fill="#f2f5fb"/>
<text x="96" y="567" font-family="Arial,sans-serif" fill="#283747" font-size="16" font-weight="700">Interaction promise</text>
<text x="96" y="593" font-family="Arial,sans-serif" fill="#566679" font-size="14">A click causes an understandable, recoverable result.</text>
<text x="663" y="174" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#222f40">02 — Dialog + error recovery</text>
