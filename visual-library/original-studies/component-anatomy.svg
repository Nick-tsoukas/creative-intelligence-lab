<text x="75" y="340" font-family="Arial,sans-serif" fill="#4338ca" font-size="15" font-weight="700">PRIMARY</text>
<text x="274" y="340" font-family="Arial,sans-serif" fill="#566679" font-size="15" font-weight="700">SECONDARY</text>
<text x="75" y="386" font-family="Arial,sans-serif" fill="#283747" font-size="17" font-weight="700">State anatomy</text>
<rect x="75" y="410" width="130" height="54" rx="12" fill="#4338ca"/>
<text x="117" y="443" font-family="Arial,sans-serif" fill="white" font-size="16">Rest</text>
