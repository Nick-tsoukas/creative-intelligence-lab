<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title description">
<title id="title">Component anatomy — visual hierarchy and behavioral states</title>
<desc id="description">Original diagram with example actions, a modal and form validation, showing component structure, hierarchy, and user recovery. Not a screenshot or Apple, Fluent, or GOV.UK product.</desc>
<rect width="1200" height="730" fill="#eef1f5"/>
<text x="50" y="62" font-family="Arial,sans-serif" fill="#202a38" font-size="32" font-weight="700">COMPONENT ANATOMY</text>
<text x="50" y="92" font-family="Arial,sans-serif" fill="#586475" font-size="18">Original teaching diagram — appearance + interaction contract</text>
<rect x="40" y="125" width="536" height="535" rx="22" fill="#fff" stroke="#ced5df"/>
<rect x="624" y="125" width="536" height="535" rx="22" fill="#fff" stroke="#ced5df"/>
<text x="75" y="174" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#222f40">01 — Action hierarchy</text>
<text x="75" y="205" font-family="Arial,sans-serif" font-size="15" fill="#627083">Button styles signal priority, not arbitrary size.</text>
<rect x="75" y="251" width="183" height="57" rx="13" fill="#4338ca"/>
<text x="107" y="287" font-family="Arial,sans-serif" fill="white" font-size="18" font-weight="700">Publish item</text>
