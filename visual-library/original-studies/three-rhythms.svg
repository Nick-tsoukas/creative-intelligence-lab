<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 455" role="img" aria-labelledby="title desc"><title id="title">Three kinds of visual pacing</title><desc id="desc">Original diagram comparing stillness, cinematic reveal and functional feedback through invented geometric frames, not screenshots of films or websites.</desc><rect width="1200" height="455" fill="#ece8df"/><text x="36" y="46" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17202c">RHYTHM IS A DESIGN DECISION</text><text x="36" y="71" font-family="Arial,sans-serif" font-size="15" fill="#596270">One subject, three pacing structures — original storyboard study</text><g transform="translate(36 105)"><rect width="357" height="300" rx="14" fill="#132537"/><path d="M0 160H357" stroke="#d3d2be" stroke-width="2"/><circle cx="177" cy="150" r="26" fill="#d0d9c2"/><text x="20" y="36" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">01 / STILLNESS</text><text x="20" y="267" font-family="Arial,sans-serif" font-size="15" fill="#d0d9c2">Fixed composition, changing atmosphere</text><text x="20" y="284" font-family="Arial,sans-serif" font-size="12" fill="#a6b5c2">A frame invites unhurried examination.</text></g><g transform="translate(421 105)"><rect width="357" height="300" rx="14" fill="#222035"/><rect x="24" y="85" width="95" height="127" rx="4" fill="#493c5c"/><rect x="131" y="85" width="95" height="127" rx="4" fill="#74606f"/><rect x="238" y="85" width="95" height="127" rx="4" fill="#c4816b"/><path d="M58 148H296" stroke="#f4d4ab" stroke-width="5" stroke-dasharray="7 10"/><text x="20" y="36" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">02 / CINEMATIC REVEAL</text><text x="20" y="267" font-family="Arial,sans-serif" font-size="15" fill="#f2d9ca">Three beats, one developing idea</text><text x="20" y="284" font-family="Arial,sans-serif" font-size="12" fill="#d1beca">Reveal only what advances the story.</text></g><g transform="translate(806 105)"><rect width="357" height="300" rx="14" fill="#eeeae3" stroke="#abb1ab"/><rect x="23" y="83" width="310" height="57" rx="7" fill="#fff" stroke="#5f6975"/><text x="40" y="118" font-family="Arial,sans-serif" font-size="16" fill="#3d4b56">Select a recording</text><rect x="23" y="157" width="195" height="52" rx="7" fill="#195f63"/><text x="44" y="189" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Selection saved ✓</text><text x="20" y="36" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#263541">03 / OPERATIONAL</text><text x="20" y="267" font-family="Arial,sans-serif" font-size="15" fill="#334351">Fast feedback, no spectacle</text><text x="20" y="284" font-family="Arial,sans-serif" font-size="12" fill="#586775">Make action and result obvious.</text></g><text x="600" y="443" font-size="12" text-anchor="middle" font-family="Arial,sans-serif" fill="#606a74">ORIGINAL TEACHING DIAGRAM · NO THIRD-PARTY FRAMES, PHOTOGRAPHS OR CAPTURED INTERFACES</text></svg>