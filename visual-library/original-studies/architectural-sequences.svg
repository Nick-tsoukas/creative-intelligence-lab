<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Three architectural sequencing models for an interface</title><desc id="d">Original teaching graphic showing promenade, focal aperture, and threshold as conceptual interface structures. Not real architecture images, screenshots, or measured user paths.</desc>
<rect width="1200" height="620" fill="#f0eee8"/>
<text x="36" y="52" font-family="Arial,sans-serif" font-weight="700" font-size="30" fill="#18222d">SPACE TEACHES SEQUENCE</text><text x="36" y="80" font-family="Arial,sans-serif" font-size="16" fill="#64707e">One fictional product, three architecture-derived story structures</text>
