<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 625" role="img" aria-labelledby="title desc"><title id="title">Same content, different attention structure</title><desc id="desc">Original information architecture experiment with two layouts containing the same fictional event facts. Left: noisy announcements and competing actions. Right: subject-specific storytelling and clear event action. Not a tested usability result.</desc><rect width="1240" height="625" fill="#ebece9"/><text x="32" y="48" font-family="Arial,sans-serif" font-weight="700" font-size="28" fill="#1c2a36">COMPOSITION CAN REVEAL OR HIDE PURPOSE</text><text x="32" y="73" font-family="Arial,sans-serif" font-size="16" fill="#637180">Same information, different hierarchy · independent original interface mockups</text>
